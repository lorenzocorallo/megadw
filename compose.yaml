name: megadw

services:
  megadw:
    image: ghcr.io/lorenzocorallo/megadw:latest
    user: "65532:65532"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_signal: SIGTERM
    stop_grace_period: 25s
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Change only these two source paths.
      - type: bind
        source: /path/to/megadw/state
        target: /var/lib/megadw
      - type: bind
        source: /path/to/megadw/downloads
        target: /downloads
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    healthcheck:
      test: ["CMD", "/usr/local/bin/megadw", "-healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
